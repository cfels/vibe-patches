name: Check generated metadata

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_gpr.user: ${{ secrets.PACKAGES_USERNAME || github.actor }}
      ORG_GRADLE_PROJECT_gpr.key: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK for Gradle configuration
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Check release automation
        run: python3 scripts/test_release_build.py

      - name: Verify generated metadata is current
        run: python3 .github/scripts/prepare_release.py --check
