name: Prepare Vibe Patch release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

concurrency:
  group: vibe-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_gpr.user: ${{ secrets.PACKAGES_USERNAME || github.actor }}
      ORG_GRADLE_PROJECT_gpr.key: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK for Gradle configuration
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Bump version and regenerate metadata
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/prepare_release.py --bump "$BUMP"

      - name: Check release automation
        run: python3 scripts/test_release_build.py

      - name: Commit and push generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version=$(awk -F= '/^version[[:space:]]*=/ {gsub(/[[:space:]\r]/,"",$2); print $2}' gradle.properties)
          git add gradle.properties patches-list.json patches-bundle.json README.md
          git diff --cached --check
          git commit -m "chore: prepare v${version} [skip ci]"
          git push origin HEAD:main
          printf 'Prepared v%s and pushed version/metadata to main. Publish the matching vibe-patch-%s.mpp release asset before updating Morphe.\n' "$version" "$version" >> "$GITHUB_STEP_SUMMARY"
