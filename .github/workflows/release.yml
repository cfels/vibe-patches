name: Build and release Vibe Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vibe-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The optional PAT reads Morphe's external Maven packages.
      # Publishing always uses this repository's own token.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_gpr_user: ${{ secrets.PACKAGES_USERNAME || github.actor }}
      ORG_GRADLE_PROJECT_gpr_key: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build and test
        run: bash compile.sh --no-daemon

      - name: Check release staging
        run: python3 scripts/test_release_build.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Create versioned release
        id: release
        uses: cycjimmy/semantic-release-action@v6

      - name: Locate current bundle
        id: bundle
        run: |
          version=$(awk -F= '/^version[[:space:]]*=/ {gsub(/[[:space:]\r]/,"",$2); print $2; exit}' gradle.properties)
          printf 'path=patches/build/libs/vibe-patch-%s.mpp\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: vibe-patch-${{ github.run_number }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error

      - name: Release summary
        env:
          PUBLISHED: ${{ steps.release.outputs.new_release_published }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          if [[ "$PUBLISHED" == 'true' ]]; then
            printf 'Released Vibe Patch %s.\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Build passed. No new release: no release-worthy commits since the last release.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
